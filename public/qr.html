<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - QR入退場">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - QR入退場</title>
  <style>
    .qr-container {
      max-width: 500px;
      margin: 0 auto;
    }
    .qr-reader {
      width: 100%;
      border: 2px solid #2196F3;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .qr-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <h2>QR入退場</h2>

    <div class="qr-container">
      <div class="card">
        <h3>カメラでQRを読み取る</h3>
        <video id="qrCamera" class="qr-reader"></video>
        <div id="cameraStatus" style="color: #666; margin-bottom: 20px;">カメラの準備中...</div>
      </div>

      <div class="card">
        <h3>手動入力</h3>
        <input type="text" id="workerIdInput" class="qr-input" placeholder="作業員IDを入力">
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-primary" onclick="recordAttendance('in')">入場</button>
          <button class="btn btn-danger" onclick="recordAttendance('out')">退場</button>
        </div>
      </div>

      <div class="card">
        <h3>最近の記録</h3>
        <table class="table">
          <thead>
            <tr>
              <th>作業員</th>
              <th>時刻</th>
              <th>種別</th>
            </tr>
          </thead>
          <tbody id="attendanceList">
            <tr><td colspan="3" class="text-center">記録なし</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import firebaseConfig, { useEmulator } from './js/firebase-config.js';

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    if (useEmulator && useEmulator.enabled && location.hostname === 'localhost') {
      try {
        connectAuthEmulator(auth, `http://${useEmulator.auth.host}:${useEmulator.auth.port}`, { disableWarnings: true });
        connectFirestoreEmulator(db, useEmulator.firestore.host, useEmulator.firestore.port);
      } catch (error) {}
    }

    let lastScanTime = 0;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      initCamera();
      await loadRecentAttendance();
    });

    function initCamera() {
      const video = document.getElementById('qrCamera');
      const status = document.getElementById('cameraStatus');

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      }).then((stream) => {
        video.srcObject = stream;
        status.textContent = 'カメラ準備完了';
        startQRScanning();
      }).catch((err) => {
        console.error('カメラアクセスエラー:', err);
        status.textContent = 'カメラが利用できません。手動入力をご使用ください。';
      });
    }

    function startQRScanning() {
      // 簡易実装: QR読み取り機能は別ライブラリ（jsQR等）が必要
      console.log('QRスキャン開始');
    }

    window.navigateTo = function(url) {
      window.location.href = url;
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = '/index.html';
    };

    window.recordAttendance = async function(type) {
      const workerId = document.getElementById('workerIdInput').value.trim();
      if (!workerId) {
        alert('作業員IDを入力してください');
        return;
      }

      // デバウンス
      const now = Date.now();
      if (now - lastScanTime < 1000) {
        return;
      }
      lastScanTime = now;

      try {
        await addDoc(collection(db, 'attendance'), {
          workerId: workerId,
          type: type,
          timestamp: serverTimestamp(),
          workerName: '（名前取得予定）',
          siteName: '（現場取得予定）',
        });

        document.getElementById('workerIdInput').value = '';
        await loadRecentAttendance();
      } catch (error) {
        console.error('記録エラー:', error);
        alert('記録に失敗しました');
      }
    };

    async function loadRecentAttendance() {
      try {
        const q = query(collection(db, 'attendance'), orderBy('timestamp', 'desc'), limit(10));
        const snap = await getDocs(q);
        const tbody = document.getElementById('attendanceList');
        tbody.innerHTML = '';

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center">記録なし</td></tr>';
          return;
        }

        snap.forEach((doc) => {
          const data = doc.data();
          const ts = data.timestamp?.toDate?.() || new Date(data.timestamp);
          const time = ts.toLocaleTimeString('ja-JP');

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${data.workerName || data.workerId}</td>
            <td>${time}</td>
            <td>${data.type === 'in' ? '入場' : '退場'}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('読込エラー:', error);
      }
    }
  </script>
</body>
</html>
