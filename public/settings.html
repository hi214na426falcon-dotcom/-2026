<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 設定">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 設定</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <h2>設定</h2>

    <div class="card">
      <h3>ユーザー管理</h3>
      <p>システムユーザーを管理します（管理者のみ）</p>
      <button class="btn btn-primary" onclick="openUserModal()">ユーザーを管理</button>

      <table class="table" style="margin-top: 20px;">
        <thead>
          <tr>
            <th>メール</th>
            <th>名前</th>
            <th>ロール</th>
          </tr>
        </thead>
        <tbody id="usersList">
          <tr><td colspan="3" class="text-center">読込中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>作業員名簿 CSV出力</h3>
      <p>現場ごとの作業員名簿をCSV形式でダウンロードします（Excel対応・BOM付きUTF-8）</p>
      <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;">
        <label>現場：</label>
        <select id="siteFilter" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
          <option value="">すべての現場</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="exportCSV()">CSV出力</button>
    </div>

    <div class="card">
      <h3>その他</h3>
      <button class="btn btn-secondary" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <!-- ユーザー管理モーダル -->
  <div id="userModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>ユーザー管理</h2>
        <button class="modal-close" onclick="closeUserModal()">&times;</button>
      </div>
      <form id="userForm">
        <div class="form-group">
          <label>メール</label>
          <input type="email" id="userEmail" required>
        </div>
        <div class="form-group">
          <label>名前</label>
          <input type="text" id="userName" required>
        </div>
        <div class="form-group">
          <label>ロール</label>
          <select id="userRole" required>
            <option value="admin">管理者</option>
            <option value="prime">元請</option>
            <option value="manager">現場管理者</option>
            <option value="partner">協力会社</option>
            <option value="worker">作業員</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">作成</button>
          <button type="button" class="btn btn-secondary" onclick="closeUserModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { onAuthStateChanged, signOut } from '/vendor/firebase/firebase-auth.js';
    import { collection, getDocs } from '/vendor/firebase/firebase-firestore.js';
    import { auth, db } from './js/app-firebase.js';

    let companiesMap = {};
    let sitesMap = {};

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadUsers();
      await loadLookups();
    });

    async function loadUsers() {
      try {
        const snap = await getDocs(collection(db, 'users'));
        const tbody = document.getElementById('usersList');
        tbody.innerHTML = '';

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center">ユーザーがありません</td></tr>';
          return;
        }

        snap.forEach((d) => {
          const data = d.data();
          const roleLabel = {
            'admin': '管理者', 'prime': '元請', 'manager': '現場管理者',
            'partner': '協力会社', 'worker': '作業員'
          }[data.role] || data.role;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${escapeHtml(data.email)}</td>
            <td>${escapeHtml(data.name)}</td>
            <td>${escapeHtml(roleLabel)}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('ユーザー読込エラー:', error);
      }
    }

    async function loadLookups() {
      companiesMap = {};
      sitesMap = {};
      const siteFilter = document.getElementById('siteFilter');
      try {
        const [companiesSnap, sitesSnap] = await Promise.all([
          getDocs(collection(db, 'companies')),
          getDocs(collection(db, 'sites')),
        ]);
        companiesSnap.forEach((d) => { companiesMap[d.id] = d.data().name; });
        sitesSnap.forEach((d) => {
          sitesMap[d.id] = d.data().name;
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.data().name;
          siteFilter.appendChild(opt);
        });
      } catch (error) {
        console.error('マスタ読込エラー:', error);
      }
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    window.navigateTo = (url) => { window.location.href = url; };
    window.logout = async () => { await signOut(auth); window.location.href = '/index.html'; };
    window.openUserModal = () => {
      document.getElementById('userForm').reset();
      document.getElementById('userModal').classList.add('active');
    };
    window.closeUserModal = () => {
      document.getElementById('userModal').classList.remove('active');
    };

    window.exportCSV = async function() {
      try {
        const siteFilter = document.getElementById('siteFilter').value;
        const snap = await getDocs(collection(db, 'workers'));

        const header = ['配属現場', '所属会社', '氏名', 'カナ', '国籍', '在留資格', '在留期限', '電話', '職能'];
        const rows = [header];

        snap.forEach((d) => {
          const w = d.data();
          if (siteFilter && w.siteId !== siteFilter) return;
          rows.push([
            w.siteId ? (sitesMap[w.siteId] || '(削除済み現場)') : '未配属',
            companiesMap[w.companyId] || '-',
            w.name || '',
            w.nameKana || '',
            w.nationality || '',
            w.visaType || '',
            w.visaExpiry || '',
            w.tel || '',
            w.skill || '',
          ]);
        });

        if (rows.length === 1) {
          alert('出力対象の作業員がいません');
          return;
        }

        const BOM = '﻿';
        const csv = BOM + rows.map((row) =>
          row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')
        ).join('\r\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const label = siteFilter ? (sitesMap[siteFilter] || 'site') : 'all';
        const today = new Date().toISOString().slice(0, 10);
        link.setAttribute('href', url);
        link.setAttribute('download', `worker_roster_${label}_${today}.csv`);
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        console.error('CSV出力エラー:', error);
        alert('CSVの生成に失敗しました');
      }
    };

    document.getElementById('userForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('ユーザー作成はFirebase Consoleから行ってください');
      closeUserModal();
    });
  </script>
</body>
</html>
