<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - ダッシュボード">
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - ダッシュボード</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <h2>ダッシュボード</h2>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-label">現場数</div>
        <div class="stat-value" id="sitesCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">作業員数</div>
        <div class="stat-value" id="workersCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">配属済み</div>
        <div class="stat-value" id="assignedCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">会社数</div>
        <div class="stat-value" id="companiesCount">0</div>
      </div>
    </div>

    <div class="card">
      <h3>現場別の配属人数</h3>
      <table class="table">
        <thead>
          <tr>
            <th>現場名</th>
            <th>元請会社</th>
            <th>状態</th>
            <th>配属人数</th>
          </tr>
        </thead>
        <tbody id="siteRosterList">
          <tr><td colspan="4" class="text-center">データなし</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" id="unassignedCard" style="display:none;">
      <h3>未配属の作業員</h3>
      <p id="unassignedText" style="color:#666;"></p>
    </div>
  </div>

  <script type="module">
    import { onAuthStateChanged, signOut } from '/vendor/firebase/firebase-auth.js';
    import { collection, getDocs } from '/vendor/firebase/firebase-firestore.js';
    import { auth, db } from './js/app-firebase.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }
      await loadDashboard();
    });

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function loadDashboard() {
      try {
        const [companiesSnap, sitesSnap, workersSnap] = await Promise.all([
          getDocs(collection(db, 'companies')),
          getDocs(collection(db, 'sites')),
          getDocs(collection(db, 'workers')),
        ]);

        const companiesMap = {};
        companiesSnap.forEach((d) => { companiesMap[d.id] = d.data().name; });

        const sites = sitesSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        const workers = workersSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

        const assigned = workers.filter((w) => w.siteId).length;

        document.getElementById('sitesCount').textContent = sites.length;
        document.getElementById('workersCount').textContent = workers.length;
        document.getElementById('assignedCount').textContent = assigned;
        document.getElementById('companiesCount').textContent = companiesSnap.size;

        // 現場別 配属人数
        const tbody = document.getElementById('siteRosterList');
        tbody.innerHTML = '';
        if (sites.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center">現場が登録されていません</td></tr>';
        } else {
          sites.forEach((s) => {
            const count = workers.filter((w) => w.siteId === s.id).length;
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${escapeHtml(s.name)}</td>
              <td>${escapeHtml(companiesMap[s.companyId] || '-')}</td>
              <td>${s.status === 'completed' ? '完了' : '進行中'}</td>
              <td><strong>${count}</strong> 人</td>
            `;
            tbody.appendChild(row);
          });
        }

        // 未配属
        const unassigned = workers.length - assigned;
        if (unassigned > 0) {
          document.getElementById('unassignedCard').style.display = 'block';
          document.getElementById('unassignedText').textContent =
            `${unassigned}人 の作業員がどの現場にも配属されていません。「作業員」画面で配属先を設定してください。`;
        }
      } catch (error) {
        console.error('ダッシュボード読込エラー:', error);
      }
    }

    window.navigateTo = (url) => { window.location.href = url; };
    window.logout = async () => { await signOut(auth); window.location.href = '/index.html'; };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
