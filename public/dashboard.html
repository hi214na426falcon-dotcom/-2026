<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - ダッシュボード">
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - ダッシュボード</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/qr.html')">QR</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <h2>ダッシュボード</h2>

    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-label">現場数</div>
        <div class="stat-value" id="sitesCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">作業員数</div>
        <div class="stat-value" id="workersCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本日入場数</div>
        <div class="stat-value" id="todayCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">会社数</div>
        <div class="stat-value" id="companiesCount">0</div>
      </div>
    </div>

    <div class="card">
      <h3>最近の入退場</h3>
      <table class="table">
        <thead>
          <tr>
            <th>作業員名</th>
            <th>現場</th>
            <th>時刻</th>
            <th>種別</th>
          </tr>
        </thead>
        <tbody id="attendanceList">
          <tr><td colspan="4" class="text-center">データなし</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import firebaseConfig from './js/firebase-config.js';

    // Firebase 設定確認
    if (!firebaseConfig.projectId || firebaseConfig.projectId === 'YOUR_PROJECT_ID') {
      window.location.href = '/index.html';
      throw new Error('Firebase config not set');
    }

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadDashboard();
    });

    async function loadDashboard() {
      try {
        // 現場数
        const sitesSnap = await getDocs(collection(db, 'sites'));
        document.getElementById('sitesCount').textContent = sitesSnap.size;

        // 作業員数
        const workersSnap = await getDocs(collection(db, 'workers'));
        document.getElementById('workersCount').textContent = workersSnap.size;

        // 会社数
        const companiesSnap = await getDocs(collection(db, 'companies'));
        document.getElementById('companiesCount').textContent = companiesSnap.size;

        // 本日入場数
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const attendanceSnap = await getDocs(collection(db, 'attendance'));
        const todayCount = attendanceSnap.docs.filter((doc) => {
          const ts = doc.data().timestamp?.toDate?.() || new Date(doc.data().timestamp);
          return ts >= today && doc.data().type === 'in';
        }).length;
        document.getElementById('todayCount').textContent = todayCount;

        // 最近の入退場
        const attendanceQuery = query(collection(db, 'attendance'), orderBy('timestamp', 'desc'), limit(10));
        const attendanceList = await getDocs(attendanceQuery);

        const tbody = document.getElementById('attendanceList');
        tbody.innerHTML = '';

        if (attendanceList.empty) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center">データなし</td></tr>';
          return;
        }

        for (const doc of attendanceList.docs) {
          const data = doc.data();
          const row = document.createElement('tr');
          const ts = data.timestamp?.toDate?.() || new Date(data.timestamp);
          const time = ts.toLocaleTimeString('ja-JP');

          row.innerHTML = `
            <td>${data.workerName || '不明'}</td>
            <td>${data.siteName || '不明'}</td>
            <td>${time}</td>
            <td>${data.type === 'in' ? '入場' : '退場'}</td>
          `;
          tbody.appendChild(row);
        }
      } catch (error) {
        console.error('ダッシュボード読込エラー:', error);
      }
    }

    window.navigateTo = function(url) {
      window.location.href = url;
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = '/index.html';
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
