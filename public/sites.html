<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 現場管理">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 現場管理</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>現場管理</h2>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 新規作成</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="現場名で検索...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>現場名</th>
          <th>元請会社</th>
          <th>現場管理者</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="sitesList">
        <tr><td colspan="5" class="text-center">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- モーダル -->
  <div id="siteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>現場情報</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="siteForm">
        <div class="form-group">
          <label>現場名</label>
          <input type="text" id="siteName" required>
        </div>
        <div class="form-group">
          <label>元請会社</label>
          <select id="siteCompany" required></select>
        </div>
        <div class="form-group">
          <label>現場管理者</label>
          <input type="text" id="siteManager">
        </div>
        <div class="form-group">
          <label>住所</label>
          <input type="text" id="siteAddress">
        </div>
        <div class="form-group">
          <label>状態</label>
          <select id="siteStatus">
            <option value="active">進行中</option>
            <option value="completed">完了</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import firebaseConfig, { useEmulator } from './js/firebase-config.js';

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    if (useEmulator && useEmulator.enabled && location.hostname === 'localhost') {
      try {
        connectAuthEmulator(auth, `http://${useEmulator.auth.host}:${useEmulator.auth.port}`, { disableWarnings: true });
        connectFirestoreEmulator(db, useEmulator.firestore.host, useEmulator.firestore.port);
      } catch (error) {}
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadCompanies();
      await loadSites();
    });

    async function loadCompanies() {
      try {
        const snap = await getDocs(collection(db, 'companies'));
        const select = document.getElementById('siteCompany');
        snap.forEach((doc) => {
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = doc.data().name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('会社読込エラー:', error);
      }
    }

    async function loadSites() {
      try {
        const snap = await getDocs(collection(db, 'sites'));
        const tbody = document.getElementById('sitesList');
        tbody.innerHTML = '';

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">現場がありません</td></tr>';
          return;
        }

        snap.forEach((doc) => {
          const data = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${data.name}</td>
            <td>${data.companyName || '-'}</td>
            <td>${data.manager || '-'}</td>
            <td>${data.status === 'active' ? '進行中' : '完了'}</td>
            <td>
              <button class="btn btn-secondary" onclick="editSite('${doc.id}')">編集</button>
              <button class="btn btn-danger" onclick="deleteSite('${doc.id}')">削除</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('現場読込エラー:', error);
      }
    }

    window.navigateTo = function(url) {
      window.location.href = url;
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = '/index.html';
    };

    window.openCreateModal = function() {
      document.getElementById('siteForm').reset();
      document.getElementById('siteModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('siteModal').classList.remove('active');
    };

    window.editSite = function(id) {
      console.log('編集:', id);
    };

    window.deleteSite = async function(id) {
      if (confirm('削除しますか？')) {
        try {
          await deleteDoc(doc(db, 'sites', id));
          await loadSites();
        } catch (error) {
          console.error('削除エラー:', error);
        }
      }
    };

    document.getElementById('siteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          name: document.getElementById('siteName').value,
          companyId: document.getElementById('siteCompany').value,
          manager: document.getElementById('siteManager').value,
          address: document.getElementById('siteAddress').value,
          status: document.getElementById('siteStatus').value,
        };

        await addDoc(collection(db, 'sites'), data);
        closeModal();
        await loadSites();
      } catch (error) {
        console.error('保存エラー:', error);
      }
    });
  </script>
</body>
</html>
