<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 現場管理">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 現場管理</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>現場管理</h2>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 新規作成</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="現場名で検索...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>現場名</th>
          <th>元請会社</th>
          <th>現場管理者</th>
          <th>配属人数</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="sitesList">
        <tr><td colspan="6" class="text-center">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 現場情報モーダル -->
  <div id="siteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="siteModalTitle">現場情報</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="siteForm">
        <div class="form-group">
          <label>現場名 <span style="color:#d32f2f;">*</span></label>
          <input type="text" id="siteName" required>
        </div>
        <div class="form-group">
          <label>元請会社 <span style="color:#d32f2f;">*</span></label>
          <select id="siteCompany" required></select>
        </div>
        <div class="form-group">
          <label>現場管理者</label>
          <input type="text" id="siteManager">
        </div>
        <div class="form-group">
          <label>住所</label>
          <input type="text" id="siteAddress">
        </div>
        <div class="form-group">
          <label>状態</label>
          <select id="siteStatus">
            <option value="active">進行中</option>
            <option value="completed">完了</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 名簿モーダル -->
  <div id="rosterModal" class="modal">
    <div class="modal-content" style="max-width: 640px;">
      <div class="modal-header">
        <h2 id="rosterTitle">配属名簿</h2>
        <button class="modal-close" onclick="closeRoster()">&times;</button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>氏名</th>
            <th>所属会社</th>
            <th>国籍</th>
            <th>職能</th>
          </tr>
        </thead>
        <tbody id="rosterList">
          <tr><td colspan="4" class="text-center">読込中...</td></tr>
        </tbody>
      </table>
      <div style="margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="closeRoster()">閉じる</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { onAuthStateChanged, signOut } from '/vendor/firebase/firebase-auth.js';
    import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from '/vendor/firebase/firebase-firestore.js';
    import { auth, db } from './js/app-firebase.js';

    let companiesMap = {};
    let allSites = [];
    let allWorkers = [];
    let currentSiteId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadCompanies();
      await loadWorkers();
      await loadSites();

      document.getElementById('searchInput').addEventListener('input', renderSites);
    });

    async function loadCompanies() {
      companiesMap = {};
      const select = document.getElementById('siteCompany');
      select.innerHTML = '';
      try {
        const snap = await getDocs(collection(db, 'companies'));
        snap.forEach((d) => {
          companiesMap[d.id] = d.data().name;
          const option = document.createElement('option');
          option.value = d.id;
          option.textContent = d.data().name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('会社読込エラー:', error);
      }
    }

    async function loadWorkers() {
      try {
        const snap = await getDocs(collection(db, 'workers'));
        allWorkers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (error) {
        console.error('作業員読込エラー:', error);
      }
    }

    async function loadSites() {
      try {
        const snap = await getDocs(collection(db, 'sites'));
        allSites = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderSites();
      } catch (error) {
        console.error('現場読込エラー:', error);
      }
    }

    function countWorkers(siteId) {
      return allWorkers.filter((w) => w.siteId === siteId).length;
    }

    function renderSites() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const tbody = document.getElementById('sitesList');
      tbody.innerHTML = '';

      const filtered = allSites.filter((s) =>
        !keyword || (s.name || '').toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">現場がありません</td></tr>';
        return;
      }

      filtered.forEach((s) => {
        const count = countWorkers(s.id);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${escapeHtml(s.name)}</td>
          <td>${escapeHtml(companiesMap[s.companyId] || '-')}</td>
          <td>${escapeHtml(s.manager || '-')}</td>
          <td>
            <button class="btn btn-success" onclick="showRoster('${s.id}')">${count}人 の名簿</button>
          </td>
          <td>${s.status === 'completed' ? '完了' : '進行中'}</td>
          <td>
            <button class="btn btn-secondary" onclick="editSite('${s.id}')">編集</button>
            <button class="btn btn-danger" onclick="deleteSite('${s.id}')">削除</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    window.showRoster = function(siteId) {
      const site = allSites.find((s) => s.id === siteId);
      const workers = allWorkers.filter((w) => w.siteId === siteId);
      document.getElementById('rosterTitle').textContent = `${site ? site.name : ''} の配属名簿（${workers.length}人）`;
      const tbody = document.getElementById('rosterList');
      tbody.innerHTML = '';

      if (workers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">配属されている作業員はいません</td></tr>';
      } else {
        workers.forEach((w) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${escapeHtml(w.name)}</td>
            <td>${escapeHtml(companiesMap[w.companyId] || '-')}</td>
            <td>${escapeHtml(w.nationality || '-')}</td>
            <td>${escapeHtml(w.skill || '-')}</td>
          `;
          tbody.appendChild(row);
        });
      }
      document.getElementById('rosterModal').classList.add('active');
    };

    window.closeRoster = function() {
      document.getElementById('rosterModal').classList.remove('active');
    };

    window.navigateTo = (url) => { window.location.href = url; };
    window.logout = async () => { await signOut(auth); window.location.href = '/index.html'; };

    window.openCreateModal = function() {
      currentSiteId = null;
      document.getElementById('siteModalTitle').textContent = '現場 新規作成';
      document.getElementById('siteForm').reset();
      document.getElementById('siteModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('siteModal').classList.remove('active');
    };

    window.editSite = function(id) {
      const s = allSites.find((x) => x.id === id);
      if (!s) return;
      currentSiteId = id;
      document.getElementById('siteModalTitle').textContent = '現場 編集';
      document.getElementById('siteName').value = s.name || '';
      document.getElementById('siteCompany').value = s.companyId || '';
      document.getElementById('siteManager').value = s.manager || '';
      document.getElementById('siteAddress').value = s.address || '';
      document.getElementById('siteStatus').value = s.status || 'active';
      document.getElementById('siteModal').classList.add('active');
    };

    window.deleteSite = async function(id) {
      const count = countWorkers(id);
      if (count > 0) {
        if (!confirm(`この現場には${count}人が配属されています。削除すると配属情報が残ります。削除しますか？`)) return;
      } else {
        if (!confirm('削除しますか？')) return;
      }
      try {
        await deleteDoc(doc(db, 'sites', id));
        await loadSites();
      } catch (error) {
        console.error('削除エラー:', error);
        alert('削除に失敗しました');
      }
    };

    document.getElementById('siteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          name: document.getElementById('siteName').value.trim(),
          companyId: document.getElementById('siteCompany').value,
          manager: document.getElementById('siteManager').value.trim(),
          address: document.getElementById('siteAddress').value.trim(),
          status: document.getElementById('siteStatus').value,
        };

        if (currentSiteId) {
          await updateDoc(doc(db, 'sites', currentSiteId), data);
        } else {
          await addDoc(collection(db, 'sites'), data);
        }

        closeModal();
        await loadSites();
      } catch (error) {
        console.error('保存エラー:', error);
        alert('保存に失敗しました');
      }
    });
  </script>
</body>
</html>
