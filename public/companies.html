<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 会社管理">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 会社管理</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/workers.html')">作業員</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>会社管理</h2>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 新規作成</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="会社名で検索...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>会社名</th>
          <th>種別</th>
          <th>電話</th>
          <th>住所</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="companiesList">
        <tr><td colspan="5" class="text-center">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- モーダル -->
  <div id="companyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>会社情報</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="companyForm">
        <div class="form-group">
          <label>会社名</label>
          <input type="text" id="companyName" required>
        </div>
        <div class="form-group">
          <label>種別</label>
          <select id="companyType" required>
            <option value="prime">元請</option>
            <option value="partner">協力会社</option>
          </select>
        </div>
        <div class="form-group">
          <label>電話</label>
          <input type="tel" id="companyTel">
        </div>
        <div class="form-group">
          <label>住所</label>
          <input type="text" id="companyAddress">
        </div>
        <div class="form-group">
          <label>担当者</label>
          <input type="text" id="companyContact">
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import firebaseConfig, { useEmulator } from './js/firebase-config.js';

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    // エミュレータに接続
    if (useEmulator && useEmulator.enabled && location.hostname === 'localhost') {
      try {
        connectAuthEmulator(auth, `http://${useEmulator.auth.host}:${useEmulator.auth.port}`, { disableWarnings: true });
        connectFirestoreEmulator(db, useEmulator.firestore.host, useEmulator.firestore.port);
      } catch (error) {
        console.warn('Emulator 接続:', error.message);
      }
    }

    let currentCompanyId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadCompanies();
    });

    async function loadCompanies() {
      try {
        const snap = await getDocs(collection(db, 'companies'));
        const tbody = document.getElementById('companiesList');
        tbody.innerHTML = '';

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">会社情報がありません</td></tr>';
          return;
        }

        snap.forEach((doc) => {
          const data = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${data.name}</td>
            <td>${data.type === 'prime' ? '元請' : '協力会社'}</td>
            <td>${data.tel || '-'}</td>
            <td>${data.address || '-'}</td>
            <td>
              <button class="btn btn-secondary" onclick="editCompany('${doc.id}')">編集</button>
              <button class="btn btn-danger" onclick="deleteCompany('${doc.id}')">削除</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('会社読込エラー:', error);
      }
    }

    window.navigateTo = function(url) {
      window.location.href = url;
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = '/index.html';
    };

    window.openCreateModal = function() {
      currentCompanyId = null;
      document.getElementById('companyForm').reset();
      document.getElementById('companyModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('companyModal').classList.remove('active');
    };

    window.editCompany = async function(id) {
      // 実装予定
      console.log('編集:', id);
    };

    window.deleteCompany = async function(id) {
      if (confirm('削除しますか？')) {
        try {
          await deleteDoc(doc(db, 'companies', id));
          await loadCompanies();
        } catch (error) {
          console.error('削除エラー:', error);
        }
      }
    };

    document.getElementById('companyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          name: document.getElementById('companyName').value,
          type: document.getElementById('companyType').value,
          tel: document.getElementById('companyTel').value,
          address: document.getElementById('companyAddress').value,
          contact: document.getElementById('companyContact').value,
        };

        if (currentCompanyId) {
          await updateDoc(doc(db, 'companies', currentCompanyId), data);
        } else {
          await addDoc(collection(db, 'companies'), data);
        }

        closeModal();
        await loadCompanies();
      } catch (error) {
        console.error('保存エラー:', error);
      }
    });
  </script>
</body>
</html>
