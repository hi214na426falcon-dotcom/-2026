<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 作業員管理">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 作業員管理</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>作業員管理</h2>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 新規作成</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="作業員名で検索...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>氏名</th>
          <th>所属会社</th>
          <th>国籍</th>
          <th>在留資格</th>
          <th>在留期限</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="workersList">
        <tr><td colspan="6" class="text-center">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- モーダル -->
  <div id="workerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>作業員情報</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="workerForm">
        <div class="form-group">
          <label>氏名</label>
          <input type="text" id="workerName" required>
        </div>
        <div class="form-group">
          <label>氏名（カナ）</label>
          <input type="text" id="workerNameKana">
        </div>
        <div class="form-group">
          <label>所属会社</label>
          <select id="workerCompany" required></select>
        </div>
        <div class="form-group">
          <label>国籍</label>
          <input type="text" id="workerNationality">
        </div>
        <div class="form-group">
          <label>在留資格</label>
          <input type="text" id="workerVisaType">
        </div>
        <div class="form-group">
          <label>在留期限</label>
          <input type="date" id="workerVisaExpiry">
        </div>
        <div class="form-group">
          <label>電話</label>
          <input type="tel" id="workerTel">
        </div>
        <div class="form-group">
          <label>職能</label>
          <input type="text" id="workerSkill">
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import firebaseConfig from './js/firebase-config.js';

    initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadCompanies();
      await loadWorkers();
    });

    async function loadCompanies() {
      try {
        const snap = await getDocs(collection(db, 'companies'));
        const select = document.getElementById('workerCompany');
        snap.forEach((doc) => {
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = doc.data().name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('会社読込エラー:', error);
      }
    }

    async function loadWorkers() {
      try {
        const snap = await getDocs(collection(db, 'workers'));
        const tbody = document.getElementById('workersList');
        tbody.innerHTML = '';

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center">作業員がありません</td></tr>';
          return;
        }

        snap.forEach((doc) => {
          const data = doc.data();
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${data.name}</td>
            <td>${data.companyName || '-'}</td>
            <td>${data.nationality || '-'}</td>
            <td>${data.visaType || '-'}</td>
            <td>${data.visaExpiry || '-'}</td>
            <td>
              <button class="btn btn-secondary" onclick="editWorker('${doc.id}')">編集</button>
              <button class="btn btn-danger" onclick="deleteWorker('${doc.id}')">削除</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('作業員読込エラー:', error);
      }
    }

    window.navigateTo = function(url) {
      window.location.href = url;
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = '/index.html';
    };

    window.openCreateModal = function() {
      document.getElementById('workerForm').reset();
      document.getElementById('workerModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('workerModal').classList.remove('active');
    };

    window.editWorker = function(id) {
      console.log('編集:', id);
    };

    window.deleteWorker = async function(id) {
      if (confirm('削除しますか？')) {
        try {
          await deleteDoc(doc(db, 'workers', id));
          await loadWorkers();
        } catch (error) {
          console.error('削除エラー:', error);
        }
      }
    };

    document.getElementById('workerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          name: document.getElementById('workerName').value,
          nameKana: document.getElementById('workerNameKana').value,
          companyId: document.getElementById('workerCompany').value,
          nationality: document.getElementById('workerNationality').value,
          visaType: document.getElementById('workerVisaType').value,
          visaExpiry: document.getElementById('workerVisaExpiry').value,
          tel: document.getElementById('workerTel').value,
          skill: document.getElementById('workerSkill').value,
        };

        await addDoc(collection(db, 'workers'), data);
        closeModal();
        await loadWorkers();
      } catch (error) {
        console.error('保存エラー:', error);
      }
    });
  </script>
</body>
</html>
