<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YUIME - 作業員管理">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <title>YUIME - 作業員管理</title>
</head>
<body>
  <div class="navbar">
    <h1>YUIME</h1>
    <div class="navbar-menu">
      <button onclick="navigateTo('/dashboard.html')">ダッシュボード</button>
      <button onclick="navigateTo('/companies.html')">会社</button>
      <button onclick="navigateTo('/sites.html')">現場</button>
      <button onclick="navigateTo('/settings.html')">設定</button>
      <button onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>作業員管理</h2>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 新規作成</button>
    </div>

    <div class="search-bar" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <input type="text" id="searchInput" placeholder="氏名・会社・現場で検索..." style="flex: 1; min-width: 200px;">
      <select id="siteFilter" style="padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
        <option value="">すべての現場</option>
      </select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>氏名</th>
          <th>所属会社</th>
          <th>配属現場</th>
          <th>国籍</th>
          <th>在留資格</th>
          <th>在留期限</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="workersList">
        <tr><td colspan="7" class="text-center">読込中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- モーダル -->
  <div id="workerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="workerModalTitle">作業員情報</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="workerForm">
        <div class="form-group">
          <label>氏名 <span style="color:#d32f2f;">*</span></label>
          <input type="text" id="workerName" required>
        </div>
        <div class="form-group">
          <label>氏名（カナ）</label>
          <input type="text" id="workerNameKana">
        </div>
        <div class="form-group">
          <label>所属会社 <span style="color:#d32f2f;">*</span></label>
          <select id="workerCompany" required></select>
        </div>
        <div class="form-group">
          <label>配属現場</label>
          <select id="workerSite">
            <option value="">未配属</option>
          </select>
        </div>
        <div class="form-group">
          <label>国籍</label>
          <input type="text" id="workerNationality">
        </div>
        <div class="form-group">
          <label>在留資格</label>
          <input type="text" id="workerVisaType">
        </div>
        <div class="form-group">
          <label>在留期限</label>
          <input type="date" id="workerVisaExpiry">
        </div>
        <div class="form-group">
          <label>電話</label>
          <input type="tel" id="workerTel">
        </div>
        <div class="form-group">
          <label>職能</label>
          <input type="text" id="workerSkill">
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { onAuthStateChanged, signOut } from '/vendor/firebase/firebase-auth.js';
    import { collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from '/vendor/firebase/firebase-firestore.js';
    import { auth, db } from './js/app-firebase.js';

    let companiesMap = {};
    let sitesMap = {};
    let allWorkers = [];
    let currentWorkerId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/index.html';
        return;
      }

      await loadCompanies();
      await loadSites();
      await loadWorkers();

      document.getElementById('searchInput').addEventListener('input', renderWorkers);
      document.getElementById('siteFilter').addEventListener('change', renderWorkers);
    });

    async function loadCompanies() {
      companiesMap = {};
      const select = document.getElementById('workerCompany');
      select.innerHTML = '';
      try {
        const snap = await getDocs(collection(db, 'companies'));
        snap.forEach((d) => {
          companiesMap[d.id] = d.data().name;
          const option = document.createElement('option');
          option.value = d.id;
          option.textContent = d.data().name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('会社読込エラー:', error);
      }
    }

    async function loadSites() {
      sitesMap = {};
      const modalSelect = document.getElementById('workerSite');
      const filterSelect = document.getElementById('siteFilter');
      modalSelect.innerHTML = '<option value="">未配属</option>';
      filterSelect.innerHTML = '<option value="">すべての現場</option>';
      try {
        const snap = await getDocs(collection(db, 'sites'));
        snap.forEach((d) => {
          sitesMap[d.id] = d.data().name;
          const opt1 = document.createElement('option');
          opt1.value = d.id;
          opt1.textContent = d.data().name;
          modalSelect.appendChild(opt1);
          const opt2 = document.createElement('option');
          opt2.value = d.id;
          opt2.textContent = d.data().name;
          filterSelect.appendChild(opt2);
        });
      } catch (error) {
        console.error('現場読込エラー:', error);
      }
    }

    async function loadWorkers() {
      try {
        const snap = await getDocs(collection(db, 'workers'));
        allWorkers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderWorkers();
      } catch (error) {
        console.error('作業員読込エラー:', error);
      }
    }

    function renderWorkers() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const siteFilter = document.getElementById('siteFilter').value;
      const tbody = document.getElementById('workersList');
      tbody.innerHTML = '';

      const filtered = allWorkers.filter((w) => {
        if (siteFilter && w.siteId !== siteFilter) return false;
        if (!keyword) return true;
        const haystack = [
          w.name,
          companiesMap[w.companyId] || '',
          sitesMap[w.siteId] || '',
          w.nationality,
          w.skill
        ].join(' ').toLowerCase();
        return haystack.includes(keyword);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">該当する作業員がいません</td></tr>';
        return;
      }

      filtered.forEach((w) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${escapeHtml(w.name)}</td>
          <td>${escapeHtml(companiesMap[w.companyId] || '-')}</td>
          <td>${w.siteId ? escapeHtml(sitesMap[w.siteId] || '(削除済み現場)') : '<span style="color:#999;">未配属</span>'}</td>
          <td>${escapeHtml(w.nationality || '-')}</td>
          <td>${escapeHtml(w.visaType || '-')}</td>
          <td>${escapeHtml(w.visaExpiry || '-')}</td>
          <td>
            <button class="btn btn-secondary" onclick="editWorker('${w.id}')">編集</button>
            <button class="btn btn-danger" onclick="deleteWorker('${w.id}')">削除</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    window.navigateTo = (url) => { window.location.href = url; };
    window.logout = async () => { await signOut(auth); window.location.href = '/index.html'; };

    window.openCreateModal = function() {
      currentWorkerId = null;
      document.getElementById('workerModalTitle').textContent = '作業員 新規作成';
      document.getElementById('workerForm').reset();
      document.getElementById('workerModal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('workerModal').classList.remove('active');
    };

    window.editWorker = function(id) {
      const w = allWorkers.find((x) => x.id === id);
      if (!w) return;
      currentWorkerId = id;
      document.getElementById('workerModalTitle').textContent = '作業員 編集';
      document.getElementById('workerName').value = w.name || '';
      document.getElementById('workerNameKana').value = w.nameKana || '';
      document.getElementById('workerCompany').value = w.companyId || '';
      document.getElementById('workerSite').value = w.siteId || '';
      document.getElementById('workerNationality').value = w.nationality || '';
      document.getElementById('workerVisaType').value = w.visaType || '';
      document.getElementById('workerVisaExpiry').value = w.visaExpiry || '';
      document.getElementById('workerTel').value = w.tel || '';
      document.getElementById('workerSkill').value = w.skill || '';
      document.getElementById('workerModal').classList.add('active');
    };

    window.deleteWorker = async function(id) {
      if (!confirm('削除しますか？')) return;
      try {
        await deleteDoc(doc(db, 'workers', id));
        await loadWorkers();
      } catch (error) {
        console.error('削除エラー:', error);
        alert('削除に失敗しました');
      }
    };

    document.getElementById('workerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = {
          name: document.getElementById('workerName').value.trim(),
          nameKana: document.getElementById('workerNameKana').value.trim(),
          companyId: document.getElementById('workerCompany').value,
          siteId: document.getElementById('workerSite').value,
          nationality: document.getElementById('workerNationality').value.trim(),
          visaType: document.getElementById('workerVisaType').value.trim(),
          visaExpiry: document.getElementById('workerVisaExpiry').value,
          tel: document.getElementById('workerTel').value.trim(),
          skill: document.getElementById('workerSkill').value.trim(),
        };

        if (currentWorkerId) {
          await updateDoc(doc(db, 'workers', currentWorkerId), data);
        } else {
          await addDoc(collection(db, 'workers'), data);
        }

        closeModal();
        await loadWorkers();
      } catch (error) {
        console.error('保存エラー:', error);
        alert('保存に失敗しました');
      }
    });
  </script>
</body>
</html>
