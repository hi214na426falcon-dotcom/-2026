name: Probe FX fetch speed

# 本体 fetch-data.yml の進捗が読めない（実行中ログは404）ため、
# 少量取得で 1時間ファイルあたりの所要秒数を計測する診断用。

on:
  push:
    branches: ["claude/strategy-backtest-promote-h7bv1r"]
    paths: [".github/workflows/probe-data.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 3日分（42ファイル）の取得時間を計測
        run: |
          start=$(date +%s)
          python3 data/fetch_dukascopy.py --pair EURJPY \
            --from 2026-07-06 --to 2026-07-09 --hours 8-21 --out probe.csv
          end=$(date +%s)
          rows=$(($(wc -l < probe.csv) - 1))
          files=42
          echo "== 計測結果 =="
          echo "経過秒: $((end-start))  取得行: ${rows}  1ファイルあたり: $(( (end-start)*100/files ))/100 秒"
          head -3 probe.csv; tail -2 probe.csv
