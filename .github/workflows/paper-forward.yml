name: Paper forward test

# ペーパー・フォワードテスト実行機。heartbeat ファイルの push で1回転する。
# （schedule はデフォルトブランチ限定のため、セッション側が定時 push で駆動）

on:
  push:
    branches: ["claude/strategy-backtest-promote-h7bv1r"]
    paths: ["results/paper/heartbeat", ".github/workflows/paper-forward.yml"]

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 新着バーで紙上取引を更新
        run: python3 run_paper_forward.py
      - name: 状態をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper/
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "Paper forward tick"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done
