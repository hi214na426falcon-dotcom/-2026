name: Fetch FX data (HistData)

# Dukascopy 時間別取得はスロットリング（約21秒/ファイル）で6時間制限に収まらないため、
# 月次/年次一括 zip の HistData.com から取得する（数分/ペア）。
# ザオプションで取引できる主要FXペアを一括取得し .csv.gz でコミットする。
# merge の push は GITHUB_TOKEN のため再帰トリガーしない。

on:
  push:
    branches: ["claude/strategy-backtest-promote-h7bv1r"]
    paths: [".github/workflows/fetch-histdata.yml"]
  workflow_dispatch:
    inputs:
      pairs:
        description: "通貨ペア（空白区切り）"
        required: false
        default: "USDJPY EURJPY GBPJPY AUDJPY NZDJPY CADJPY CHFJPY EURUSD GBPUSD AUDUSD NZDUSD USDCAD USDCHF EURGBP"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: histdata パッケージ導入
        run: pip install histdata
      - name: HistData M1 取得 → data/m1/<PAIR>.csv.gz
        run: |
          python3 data/fetch_histdata.py ${{ inputs.pairs || 'USDJPY EURJPY GBPJPY AUDJPY NZDJPY CADJPY CHFJPY EURUSD GBPUSD AUDUSD NZDUSD USDCAD USDCHF EURGBP' }}
      - name: コミット＆プッシュ（実行ブランチへ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/m1/*.csv   # 旧・非圧縮CSVは gz に置換
          git add data/m1/*.csv.gz
          git commit -m "Add real HistData 1m data (multi-pair, gzip)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep 10
          done
