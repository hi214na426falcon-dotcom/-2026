name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (標準ライブラリのみ・依存インストール不要)
        run: python -m unittest discover -s tests -v
      - name: 依存パーサ自己テスト（Dukascopy .bi5）
        run: python data/fetch_dukascopy.py --self-test
      - name: スカウト オフライン経路のスモーク
        run: python run_scout.py --no-llm --pairs USDJPY EURJPY
      - name: 昇格ゲート（合成データは不合格＝正常。終了コード1を許容）
        run: python -m backtest.promote_strategy --pair EURJPY --strategy bollinger || true
